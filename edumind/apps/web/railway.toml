[build]
builder = "nixpacks"
buildCommand = "cd ../.. && pnpm install && pnpm --filter @edumind/database db:generate && pnpm --filter @edumind/web build"

[deploy]
startCommand = "pnpm --filter @edumind/web start"
healthcheckPath = "/"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
